name: 鮎まつり通知手動更新

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  notification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5
      - name: Node.jsをセットアップ
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Firebase Admin SDKをインストール
        run: npm install firebase-admin
      - name: 通知処理を実行
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node notification-worker.mjs
