name: 鮎まつり通知システム

on:
  schedule:
    # 5分ごとに実行
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  notification:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Firebase Admin SDKをインストール
        run: npm install firebase-admin

      - name: 通知処理を実行
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node notification-worker.mjs
